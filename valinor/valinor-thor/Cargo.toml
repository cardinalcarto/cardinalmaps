[package]
name = "valinor-thor"
description = "Valhalla-compatible path search and map matching (mainline's Thor): the best paths between correlated locations, and the paths of GPS traces."
version = "0.1.0"
authors.workspace = true
license.workspace = true
edition.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
enumset = { workspace = true }
# Location times are formatted in their time zones, as mainline's `DateTime::offset_date` does.
jiff = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
valhalla-graphtile = { workspace = true }
valhalla-proto = { workspace = true }
valhalla-response = { workspace = true }
# Mainline's Meili, which Thor's `trace_route` and `trace_attributes` call.
valinor-meili = { workspace = true }
valinor-sif = { workspace = true }
# Mainline's `AttributesController` is shared with Tyr's serializers, as in mainline;
# Thor also calls Tyr's `trace_attributes` serializer, as mainline's Thor does.
valinor-tyr = { workspace = true }

[dev-dependencies]
base64 = { workspace = true }
http = { workspace = true }
# The edge walk's ground truth tests send requests through the front and Loki.
valinor-loki = { workspace = true }
serde_json = { workspace = true }

[lints]
workspace = true
