[workspace]
resolver = "2"

members = [
    "bit-twiddling-helpers",
    "illuvatar",
    "illuvatar-service",
    "valhalla-graphtile",
    "valhalla-microservice",
    "valhalla-proto",
    "valhalla-response",
    "valinor-cli",
    "valinor-export-graph",
    "valinor-gtfs",
    "valinor-gtfs-rt",
    "valinor-loki",
    "valinor-loki-service",
    "valinor-router",
    "valinor-server",
    "valinor-sif",
    "valinor-tap",
    "valinor-thor",
    "valinor-thor-service",
    "valinor-transit",
    "valinor-transit-plan",
    "valinor-tyr",
]

[workspace.package]
authors = [
    "Ian Wagner <ian@stadiamaps.com>",
]
license = "GPL-3.0-only"
edition = "2024"
repository = "https://github.com/stadiamaps/valinor"
rust-version = "1.92.0"

[workspace.dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", default-features = false, features = ["http1", "http2", "tokio"] }
base64 = "0.23.1"
bitfield-struct = "0.13.0"
bit-twiddling-helpers = { path = "bit-twiddling-helpers" }
bytes = "1.12.1"
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive", "env"] }
crc32fast = "1.5.4"
csv = "1.4.0"
dashmap = "6.2.1"
enumset = "1.1.15"
flatgeobuf = { version = "6.0.1", default-features = false }
geo = "0.33.1"
geozero = "0.15.1"
http = "1.5.0"
illuvatar = { path = "illuvatar" }
indicatif = "0.18.6"
insta = { version = "1.49.0", features = ["yaml"] }
integer-encoding = "4.1.0"
itertools = "0.15.0"
jiff = "0.2.39"
lru = "0.19.0"
md-5 = { version = "0.11.0", default-features = false }
memmap2 = "0.9.12"
num-traits = "0.2.19"
num_enum = "0.7.6"
nutype = { version = "0.8.0" }
proptest = "1.12.0"
prost = "0.14.4"
prost-build = "0.14.4"
protobuf-src = "2.1.1"
protoc-bin-vendored = "3.3.0"
rand = "0.10.3"
regex = "1.13.1"
self_cell = "1.3.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_with = "3.24.0"
serde_json = "1.0.154"
tar = "0.4.46"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "fs", "io-util", "sync"] }
tower = { version = "0.5.3", features = ["util"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
valhalla-graphtile = { path = "valhalla-graphtile" }
valhalla-proto = { path = "valhalla-proto" }
valhalla-microservice = { path = "valhalla-microservice" }
valhalla-response = { path = "valhalla-response" }
valinor-loki = { path = "valinor-loki" }
valinor-router = { path = "valinor-router" }
valinor-sif = { path = "valinor-sif" }
valinor-thor = { path = "valinor-thor" }
valinor-transit = { path = "valinor-transit" }
valinor-tyr = { path = "valinor-tyr" }
walkdir = "2.5.0"
zerocopy = "0.8.63"
zerocopy-derive = "0.8.63"
zeromq = "0.7.0"
zip = { version = "9.5.0", default-features = false, features = ["deflate"] }

[profile.dev.package]
insta.opt-level = 3
similar.opt-level = 3

[profile.release]
lto = "thin"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
cast_possible_truncation = "deny"
cast_precision_loss = "deny"
cast_sign_loss = "deny"
missing_errors_doc = "deny"
module_name_repetitions = "allow"
must_use_candidate = "allow"
