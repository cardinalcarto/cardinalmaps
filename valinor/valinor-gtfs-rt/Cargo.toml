[package]
name = "valinor-gtfs-rt"
description = "Decodes GTFS-RT and builds real-time overlays for transit routing."
version = "0.1.0"
authors.workspace = true
license.workspace = true
edition.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
default = ["protoc-vendored"]
protoc-from-src = ["dep:protobuf-src"]
protoc-vendored = ["dep:protoc-bin-vendored"]

[dependencies]
prost = { workspace = true }
thiserror = { workspace = true }
valinor-transit = { path = "../valinor-transit" }

[build-dependencies]
prost-build = { workspace = true }
protobuf-src = { workspace = true, optional = true }
protoc-bin-vendored = { workspace = true, optional = true }

[dev-dependencies]
proptest = { workspace = true }

[lints]
workspace = true
