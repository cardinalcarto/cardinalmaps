[package]
name = "valinor-server"
description = "A Valhalla-compatible HTTP routing server: valinor-router behind axum."
version = "0.1.0"
authors.workspace = true
license.workspace = true
edition.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
anyhow = { workspace = true }
axum = { workspace = true }
clap = { workspace = true }
tokio = { workspace = true, features = ["net", "signal", "time"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
valinor-gtfs-rt = { path = "../valinor-gtfs-rt" }
valinor-router = { workspace = true }
valinor-transit-plan = { path = "../valinor-transit-plan" }

[dev-dependencies]
tower = { workspace = true }
valinor-gtfs = { path = "../valinor-gtfs" }
valinor-transit-plan = { path = "../valinor-transit-plan", features = ["test-support"] }

[lints]
workspace = true
