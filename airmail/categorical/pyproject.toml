[project]
name = "airmail-categories"
version = "0.1.0"
description = "Trains Airmail's categorical search model from OSM names and tags"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fasttext-wheel>=0.9.2",
    "langcodes>=3.4",
    # fasttext's predict() breaks under numpy 2.
    "numpy>=1.26,<2",
]

[project.scripts]
categories-augment = "airmail_categories.augment:main"
categories-languages = "airmail_categories.languages:main"
categories-train = "airmail_categories.train:main"
categories-evaluate = "airmail_categories.evaluate:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
