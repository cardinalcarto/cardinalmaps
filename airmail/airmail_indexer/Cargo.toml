[package]
name = "airmail_indexer"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
default-run = "indexer"

[[bin]]
name = "indexer"
path = "src/main.rs"

[[bin]]
name = "query"
path = "src/bin/query.rs"

[[bin]]
name = "merge"
path = "src/bin/merge.rs"

[[bin]]
name = "tagger"
path = "src/bin/tagger.rs"

[[bin]]
name = "spatial_bench"
path = "src/bin/spatial_bench.rs"

[[bin]]
name = "categories_export"
path = "src/bin/categories_export.rs"

[[bin]]
name = "categories_prune"
path = "src/bin/categories_prune.rs"

[[bin]]
name = "tagger_prune"
path = "src/bin/tagger_prune.rs"

[lib]
name = "airmail_indexer"
path = "src/lib.rs"

[dependencies]
airmail_tagger = { path = "../airmail_tagger" }
fst = "0.4.7"
rand = "0.9"
airmail.workspace = true
airmail_importance.workspace = true
anyhow.workspace = true
clap.workspace = true
flate2 = "1.1.10"
crossbeam = { version = "0.8.5", features = ["crossbeam-channel"] }
deunicode.workspace = true
env_logger.workspace = true
futures-util.workspace = true
geo.workspace = true
geo-types = { version = "0.7.20", features = ["serde", "use-rstar_0_12"] }
geozero = { version = "0.15.1", default-features = false, features = ["with-geo", "with-wkb"] }
log.workspace = true
num_cpus = "1.17.0"
osmpbf = "0.3.8"
postcard = { version = "1.1.3", features = ["use-std"] }
redb = "4.4.0"
rstar = { version = "0.12.2", features = ["serde"] }
rustyline = "19.0.0"
s2.workspace = true
serde.workspace = true
serde_json.workspace = true
sqlx = { version = "0.9.0", features = ["runtime-tokio", "sqlite"] }
tokio.workspace = true
