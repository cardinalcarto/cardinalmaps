[workspace]
resolver = "3"
members = ["airmail", "airmail_indexer", "airmail_service", "airmail_tagger"]

[workspace.package]
edition = "2024"
rust-version = "1.94"

[workspace.dependencies]
airmail = { path = "airmail" }
anyhow = "1.0.104"
deunicode = "1.6.2"
env_logger = "0.11.11"
futures-util = "0.3.34"
geo = "0.33.1"
lazy_static = "1.5.1"
log = "0.4.35"
s2 = "0.2.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
clap = { version = "4.6.7", features = ["derive", "env"] }
tokio = { version = "1.54.1", features = ["full"] }

[profile.release]
debug = 1
