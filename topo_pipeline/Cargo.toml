[package]
name = "topo_pipeline"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "topo"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
flate2 = "1"
prost = "0.14"
rayon = "1"
rusty-s3 = "0.11.0"
serde = { version = "1", features = ["derive"] }
tiff = { version = "0.10", features = ["zstd"] }
toml = "0.8"
ureq = "3.5.1"

[profile.release]
debug = 1
