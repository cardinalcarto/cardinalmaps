[package]
name = "topo_pipeline"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "topo"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
flate2 = "1"
prost = "0.14"
rayon = "1"
serde = { version = "1", features = ["derive"] }
tiff = "0.10"
toml = "0.8"

[profile.release]
debug = 1
