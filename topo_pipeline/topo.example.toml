# Sources are listed lowest priority first. Each later source overrides the earlier ones
# where it has data, blending over `feather` cells inside its edge.
#
# Rasters must be GeoTIFFs in geographic coordinates (NAD83 and WGS84 are treated alike) on a
# lattice of 1 arc second divided by an odd integer.

[contours]
interval_m = 10
interval_ft = 40
simplify_m = 8.0
round_corners = true

[[source]]
name = "gedtm"
dir = "/dem"
suffix = ".tif"
arcsec = 1.0
median = true
sigma = 1.2

# Rasters from zip archives in a bucket instead of a directory, with file names that include
# corners like N047W123. Credentials come from AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY.
