# Sources are listed lowest priority first. Each later source overrides the earlier ones
# where it has data, blending over `feather` cells inside its edge.
#
# Rasters must be GeoTIFFs in geographic coordinates (NAD83 and WGS84 are treated alike) on a
# lattice of 1 arc second divided by an odd integer.

[contours]
interval_m = 10
interval_ft = 40
simplify_m = 8.0
round_corners = true

[[source]]
name = "jaxa-aw3d30"
dir = "/mnt/maps"
suffix = "_DSM.tif"
arcsec = 1.0
median = true
sigma = 1.2

