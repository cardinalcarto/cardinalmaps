name: cardinal
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.7

dependencies:
  address_formatter: ^0.4.0
  characters: ^1.4.0
  collection: ^1.19.1
  drift: ^2.35.3
  drift_flutter: ^0.3.1
  flutter:
    sdk: flutter
  geolocator: ^14.1.2
  go_router: ^18.1.1
  http: ^1.6.0
  material_ui: ^1.1.0
  path_provider: ^2.1.6
  routing:
    path: ../routing
  sparkle:
    path: ../sparkle

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  drift_dev: ^2.35.2
  build_runner: ^2.17.1
  fake_async: ^1.3.3

flutter:
  uses-material-design: true
  assets:
    - assets/map/
  fonts:
    - family: CardinalIcons
      fonts:
        - asset: assets/fonts/CardinalIcons.ttf

flutter_launcher_icons:
  image_path: assets/icon/icon.png
  android: true
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/icon/icon_foreground.png
  ios: true
  remove_alpha_ios: true
  macos:
    generate: true
  windows:
    generate: true
    icon_size: 256
