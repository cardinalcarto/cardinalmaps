name: cardinal
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.7

dependencies:
  address_formatter: ^0.4.0
  # Pinned: 9.6.6 needs Flutter 3.47, which the app is on (`~/src/flutter`, stable).
  background_downloader: 9.6.6
  characters: ^1.4.0
  collection: ^1.19.1
  cupertino_icons: ^1.0.8
  cupertino_ui: ^1.1.4
  drift: ^2.35.3
  drift_flutter: ^0.3.1
  flutter:
    sdk: flutter
  flutter_tts: ^4.2.5
  geolocator: ^14.1.2
  go_router: ^18.1.1
  http: ^1.6.0
  liquid_glass_renderer: 1.0.0-dev.2
  material_ui: ^1.1.0
  path_provider: ^2.1.6
  routing:
    path: ../routing
  sparkle:
    path: ../sparkle
  # Below 1.8.1, which needs dbus 0.8, while every geolocator_linux needs dbus 0.7.
  wakelock_plus: ">=1.8.0 <1.8.1"

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  drift_dev: ^2.35.2
  build_runner: ^2.17.1
  fake_async: ^1.3.3
  crypto: ^3.0.8
  # The routing package's, for `test_rust/` to load the host build of the library.
  flutter_rust_bridge: 2.13.0

flutter:
  uses-material-design: true
  assets:
    - assets/map/
  fonts:
    - family: CardinalIcons
      fonts:
        - asset: assets/fonts/CardinalIcons.ttf

flutter_launcher_icons:
  image_path: assets/icon/icon.png
  android: true
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/icon/icon_foreground.png
  ios: true
  remove_alpha_ios: true
  macos:
    generate: true
  windows:
    generate: true
    icon_size: 256
