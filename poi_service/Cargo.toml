[package]
name = "poi_service"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
flate2 = "1.1.10"
futures-util = "0.3.34"
hex = "0.4.3"
icu_casemap = "2.4.0"
icu_normalizer = "2.4.0"
icu_properties = "2.4.0"
osmpbf = "0.3.8"
prost = "0.14.4"
quick-xml = "0.42.0"
rayon = "1.12.0"
reqwest = { version = "0.13.5", default-features = false, features = ["http2", "rustls", "stream"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls-aws-lc-rs", "postgres", "migrate", "macros", "chrono"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
