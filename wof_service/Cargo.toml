[package]
name = "wof_service"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
clap = { version = "4.6.7", features = ["derive", "env"] }
env_logger = "0.11.11"
geo = "0.33.1"
log = "0.4.35"
num_cpus = "1.17.0"
rusqlite = { version = "0.41.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
tower-http = { version = "0.7.1", features = ["compression-gzip", "compression-zstd"] }

[dev-dependencies]
flate2 = "1.1.10"
tempfile = "3.27.0"
tower = { version = "0.5.3", features = ["util"] }

[profile.release]
debug = 1
