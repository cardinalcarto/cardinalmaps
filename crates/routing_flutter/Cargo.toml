[package]
name = "routing_flutter"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"

[lib]
crate-type = ["cdylib", "staticlib", "lib"]

[dependencies]
ferrostar = { version = "0.59.0", default-features = false, features = ["std"] }
flutter_rust_bridge = "=2.13.0"
serde_json = "1"
valhalla-graphtile = { path = "../../valinor/valhalla-graphtile" }
valinor-gtfs-rt = { path = "../../valinor/valinor-gtfs-rt" }
valinor-loki = { path = "../../valinor/valinor-loki" }
valinor-router = { version = "0.1.0", path = "../../valinor/valinor-router" }
valinor-transit-plan = { path = "../../valinor/valinor-transit-plan" }
valinor-thor = { version = "0.1.0", path = "../../valinor/valinor-thor" }
valinor-walk = { path = "../../valinor/valinor-walk" }

[dev-dependencies]
valinor-gtfs = { path = "../../valinor/valinor-gtfs" }
valinor-transit-plan = { path = "../../valinor/valinor-transit-plan", features = ["test-support"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
