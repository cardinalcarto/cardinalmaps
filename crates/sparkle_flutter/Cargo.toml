[package]
name = "sparkle_flutter"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "staticlib", "lib"]

[dependencies]
anyhow = "1.0.104"
bytemuck = { version = "1.25.2", features = ["derive"] }
env_logger = "0.11.11"
flutter_rust_bridge = "=2.13.0"
log = "0.4.34"
maplibre-expr = "0.5.4"
offline_map = { version = "0.1.0", path = "../offline_map" }
serde_json = "1.0.154"
sparkle = { version = "0.1.0", path = "../sparkle" }
sparkle_view = { version = "0.1.0", path = "../sparkle_view" }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
