# The CloudNativePG operator, installed by k3s's Helm controller. Apply it
# once, before k8s/cardinal, whose database needs the operator's CRDs:
#
#   kubectl apply -f k8s/operators/cloudnative-pg.yaml
#
# Change the version and apply again to upgrade.
apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: cloudnative-pg
  namespace: kube-system
spec:
  repo: https://cloudnative-pg.github.io/charts
  chart: cloudnative-pg
  version: 0.29.1 # operator 1.30.1
  targetNamespace: cnpg-system
  createNamespace: true
