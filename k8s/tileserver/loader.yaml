# Temporary pod for copying tilesets into the volume; not part of the
# kustomization. See README.md for the procedure.
apiVersion: v1
kind: Pod
metadata:
  name: tiles-loader
  namespace: tiles
spec:
  restartPolicy: Never
  containers:
    - name: loader
      image: busybox:1.36
      command: ["sleep", "3600"]
      volumeMounts:
        - name: tiles
          mountPath: /tiles
  volumes:
    - name: tiles
      persistentVolumeClaim:
        claimName: tiles
