# Holds the .mbtiles files Martin serves; each file becomes a source named
# after it (seattle.mbtiles -> /seattle). Fill it with loader.yaml.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: tiles
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 20Gi
