# An example Who's On First place service on fly.io: wof_service answering bbox queries from
# the WOF SpatiaLite database on each machine's volume. See README.md for adapting it.

app = "cardinal-wof-example"
primary_region = "sjc"

[build]
# The cardinal-wof-service image .github/workflows/images.yml publishes for a commit on main.
image = "ghcr.io/OWNER/cardinal-wof-service:sha-COMMIT"

[env]
# Where the entrypoint downloads the database from when the volume doesn't hold it, and the
# SHA-256 of the uncompressed file. A URL ending in .bz2 is decompressed as it downloads.
# Pin a copy that doesn't change: a "latest" URL changes under a running deployment.
WOF_DB_URL = "https://BUCKET.example.com/wof/whosonfirst-data-admin-YYYYMMDD.spatial.db.bz2"
WOF_DB_SHA256 = "SHA256"
WOF_DB = "/data/whosonfirst-data-admin.spatial.db"
# Request limits; see wof_service/README.md. A Washington-state bbox is 28 square degrees and
# about 4,700 places.
WOF_MAX_AREA = "100"
WOF_MAX_PLACES = "50000"
WOF_TIMEOUT = "30"
RUST_LOG = "info"

[mounts]
# One volume per machine, holding the database (about 34 GB in 2026) plus room for the next
# one's download. Create them with `fly volumes create` (see README.md).
source = "wof_data"
destination = "/data"

[deploy]
strategy = "rolling"
max_unavailable = 1
# Long enough for a machine with an empty volume to download and decompress the database.
wait_timeout = "3h"

[http_service]
internal_port = 3000
force_https = true
# Requests are bursty (a phone downloading a region), and a stopped machine starts in seconds
# with its volume intact.
auto_stop_machines = "stop"
auto_start_machines = true
min_machines_running = 1

# Each request reads SQLite and simplifies shapes on one core; the service also queues
# requests beyond WOF_CONCURRENCY (default: the CPU count) itself.
[http_service.concurrency]
type = "requests"
soft_limit = 8
hard_limit = 32

# /health answers once the database is open, which is right away when the volume holds it.
[[http_service.checks]]
grace_period = "30s"
interval = "30s"
method = "GET"
path = "/health"
timeout = "5s"

[[vm]]
# A large response (50,000 places) is held in memory while it's written; the rest of the
# memory caches the database's pages.
size = "shared-cpu-2x"
memory = "2gb"
