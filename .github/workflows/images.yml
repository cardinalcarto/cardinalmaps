# Publishes the images k8s/cardinal runs, tagged sha-<short commit> and main, and the images
# of the same commit set up for fly.io: cardinal-airmail-flyio (deploy/geocoder) and
# cardinal-wof-service-flyio (deploy/wof_service), and cardinal-gtfs-rt-cache
# (deploy/gtfs-rt-cache). Pin a sha- tag in k8s/cardinal/kustomization.yaml,
# or the appropriate deploy/*/fly.toml to deploy it.
name: Images

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/images.yml
      - poi_service/**
      - airmail/**
      - valinor/**
      - wof_service/**
      - deploy/gtfs-rt-cache/**
      - deploy/geocoder/**
      - deploy/wof_service/**
  workflow_dispatch:

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: cardinal-poi-service
            context: poi_service
            file: poi_service/Dockerfile
            # It shares airmail's importance code.
            build-contexts: airmail_importance=airmail/airmail_importance
          - image: cardinal-airmail
            context: airmail
            file: airmail/Dockerfile
          - image: cardinal-valinor
            context: valinor
            file: valinor/Containerfile
          - image: cardinal-gtfs-rt-cache
            context: deploy/gtfs-rt-cache
            file: deploy/gtfs-rt-cache/Dockerfile
          - image: cardinal-wof-service
            context: wof_service
            file: wof_service/Dockerfile
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=main
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          build-contexts: ${{ matrix.build-contexts }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max

  # The fly.io geocoder (deploy/geocoder): this commit's cardinal-airmail with the entrypoint
  # that fills and mounts the volume, so it waits for that image.
  airmail-flyio:
    needs: build-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/cardinal-airmail-flyio
          tags: |
            type=sha,prefix=sha-
            type=raw,value=main
      # The same short-commit tag metadata-action gave cardinal-airmail above.
      - id: airmail
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/cardinal-airmail:sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/geocoder/Dockerfile
          build-args: AIRMAIL_IMAGE=${{ steps.airmail.outputs.image }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # The fly.io Who's On First service (deploy/wof_service): this commit's cardinal-wof-service
  # with the entrypoint that fills the volume with a release's database, so it waits for that
  # image.
  wof-service-flyio:
    needs: build-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/cardinal-wof-service-flyio
          tags: |
            type=sha,prefix=sha-
            type=raw,value=main
      # The same short-commit tag metadata-action gave cardinal-wof-service above.
      - id: wof
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/cardinal-wof-service:sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/wof_service/Dockerfile
          build-args: WOF_IMAGE=${{ steps.wof.outputs.image }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
