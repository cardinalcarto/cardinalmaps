# Publishes the images k8s/cardinal runs, tagged sha-<short commit> and main.
# Pin a sha- tag in k8s/cardinal/kustomization.yaml to deploy it.
name: Images

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/images.yml
      - poi_service/**
      - airmail/**
      - valinor/**
  workflow_dispatch:

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: cardinal-poi-service
            context: poi_service
            file: poi_service/Dockerfile
          - image: cardinal-airmail
            context: airmail
            file: airmail/Dockerfile
          - image: cardinal-valinor
            context: valinor
            file: valinor/Containerfile
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=main
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max
